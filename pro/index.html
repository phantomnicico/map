
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Future Soft UI Dashboard</title>

<style>
/* =========================================================
   ROOT
========================================================= */

:root {
    --bg: #e8edf5;
    --surface: #e8edf5;

    --text: #273142;
    --muted: #7d8798;

    --accent: #4f7cff;
    --accent-light: #6f94ff;

    --success: #2bb673;
    --danger: #e05252;

    --radius-xl: 28px;
    --radius-lg: 20px;
    --radius-md: 15px;

    --shadow-out:
        12px 12px 24px rgba(163, 177, 198, 0.55),
        -12px -12px 24px rgba(255, 255, 255, 0.95);

    --shadow-in:
        inset 6px 6px 12px rgba(163, 177, 198, 0.45),
        inset -6px -6px 12px rgba(255, 255, 255, 0.9);

    --shadow-soft:
        5px 5px 12px rgba(163, 177, 198, 0.4),
        -5px -5px 12px rgba(255, 255, 255, 0.9);

    --sidebar-width: 280px;

    font-family:
        "Vazirmatn",
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
}


/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: var(--bg);
    color: var(--text);
}


/* =========================================================
   MAIN APPLICATION
========================================================= */

.app {
    width: 100%;
    height: 100vh;

    display: flex;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(255,255,255,.9),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(79,124,255,.08),
            transparent 30%
        ),
        var(--bg);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    width: var(--sidebar-width);
    height: 100vh;

    flex-shrink: 0;

    padding: 24px 18px;

    display: flex;
    flex-direction: column;

    background: var(--surface);

    box-shadow:
        12px 0 30px rgba(163,177,198,.30),
        -8px 0 20px rgba(255,255,255,.7);

    position: relative;
    z-index: 10;
}


/* =========================================================
   BRAND
========================================================= */

.brand {
    height: 76px;

    display: flex;
    align-items: center;
    gap: 14px;

    padding: 12px 14px;

    border-radius: var(--radius-lg);

    box-shadow: var(--shadow-out);

    margin-bottom: 28px;
}

.brand-logo {
    width: 46px;
    height: 46px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 15px;

    color: white;

    font-size: 22px;
    font-weight: bold;

    background:
        linear-gradient(
            145deg,
            var(--accent-light),
            var(--accent)
        );

    box-shadow:
        5px 5px 12px rgba(79,124,255,.35),
        -4px -4px 10px rgba(255,255,255,.8);
}

.brand-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.brand-title {
    font-size: 15px;
    font-weight: 800;
}

.brand-subtitle {
    font-size: 11px;
    color: var(--muted);
}


/* =========================================================
   MENU
========================================================= */

.menu {
    flex: 1;

    display: flex;
    flex-direction: column;

    gap: 12px;

    overflow-y: auto;

    padding: 4px;
}

.menu::-webkit-scrollbar {
    width: 4px;
}

.menu::-webkit-scrollbar-thumb {
    background: rgba(125,135,152,.25);
    border-radius: 10px;
}


/* =========================================================
   MENU ITEM
========================================================= */

.menu-item {
    width: 100%;
    min-height: 58px;

    border: none;
    outline: none;

    display: flex;
    align-items: center;

    gap: 14px;

    padding: 0 15px;

    border-radius: var(--radius-md);

    background: var(--surface);

    color: var(--text);

    cursor: pointer;

    font-family: inherit;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        color .2s ease,
        background .2s ease;

    box-shadow: var(--shadow-soft);

    text-align: right;
}

.menu-item:hover {
    transform: translateX(-3px);

    color: var(--accent);

    box-shadow:
        7px 7px 15px rgba(163,177,198,.45),
        -7px -7px 15px rgba(255,255,255,.9);
}

.menu-item:active {
    transform: scale(.98);

    box-shadow: var(--shadow-in);
}

.menu-item.active {
    color: var(--accent);

    box-shadow: var(--shadow-in);

    background:
        linear-gradient(
            145deg,
            #e2e7ef,
            #edf2f8
        );
}

.menu-icon {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;

    font-size: 18px;

    background: var(--surface);

    box-shadow: var(--shadow-soft);

    transition: .2s ease;
}

.menu-item.active .menu-icon {
    color: white;

    background:
        linear-gradient(
            145deg,
            var(--accent-light),
            var(--accent)
        );

    box-shadow:
        4px 4px 9px rgba(79,124,255,.35),
        -4px -4px 9px rgba(255,255,255,.8);
}

.menu-label {
    font-size: 13px;
    font-weight: 600;
}


/* =========================================================
   SIDEBAR FOOTER
========================================================= */

.sidebar-footer {
    margin-top: 18px;

    padding-top: 18px;

    border-top:
        1px solid rgba(163,177,198,.25);

    text-align: center;

    font-size: 10px;

    color: var(--muted);
}


/* =========================================================
   CONTENT AREA
========================================================= */

.content {
    position: relative;

    flex: 1;

    height: 100vh;

    min-width: 0;

    padding: 18px;
}


/* =========================================================
   IFRAME CONTAINER
========================================================= */

.iframe-shell {
    width: 100%;
    height: 100%;

    position: relative;

    overflow: hidden;

    border-radius: var(--radius-xl);

    background: var(--surface);

    box-shadow: var(--shadow-out);
}


/* =========================================================
   IFRAME
========================================================= */

#pageFrame {
    width: 100%;
    height: 100%;

    display: block;

    border: none;

    background: transparent;
}


/* =========================================================
   LOADING
========================================================= */

.loading {
    position: absolute;

    inset: 0;

    z-index: 5;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        rgba(232,237,245,.92);

    backdrop-filter: blur(8px);

    transition: opacity .3s ease;
}

.loading.hidden {
    opacity: 0;
    pointer-events: none;
}

.loader-box {
    width: 210px;

    padding: 25px;

    border-radius: 22px;

    text-align: center;

    background: var(--surface);

    box-shadow: var(--shadow-out);
}

.loader {
    width: 42px;
    height: 42px;

    margin: 0 auto 15px;

    border-radius: 50%;

    border:
        4px solid rgba(79,124,255,.15);

    border-top-color: var(--accent);

    animation:
        spin .8s linear infinite;
}

.loading-text {
    font-size: 12px;

    color: var(--muted);
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 900px) {

    :root {
        --sidebar-width: 82px;
    }

    .sidebar {
        padding: 18px 10px;
    }

    .brand {
        justify-content: center;

        padding: 10px;

        margin-bottom: 20px;
    }

    .brand-text {
        display: none;
    }

    .menu-item {
        justify-content: center;

        padding: 0;
    }

    .menu-label {
        display: none;
    }

    .sidebar-footer {
        display: none;
    }

    .content {
        padding: 12px;
    }
}


/* =========================================================
   VERY SMALL SCREEN
========================================================= */

@media (max-width: 600px) {

    :root {
        --sidebar-width: 68px;
    }

    .sidebar {
        padding: 12px 7px;
    }

    .menu {
        gap: 9px;
    }

    .menu-item {
        min-height: 52px;
    }

    .menu-icon {
        width: 34px;
        height: 34px;
    }

    .content {
        padding: 8px;
    }
}

</style>
</head>


<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <!-- BRAND -->
<div class="brand">

    <div class="brand-logo">
        ◈
    </div>

    <div class="brand-text">

        <div class="brand-title">
            سامانه مدیریت هوشمند
            <br>
            مسئولیت‌های اجتماعی درآلو
        </div>

        <div class="brand-subtitle">
            Daraloo Smart Strategic CSR Management System
            <span>(DSCMS)</span>
        </div>

    </div>

</div>



        <!-- =================================================
             MENU
        ================================================== -->

<nav class="menu">

    <!-- 01 -->
    <button
        class="menu-item active"
        data-page="01.html"
    >
        <span class="menu-icon">
            🎯
        </span>

        <span class="menu-label">
            کلیات، ضرورت و اهداف طرح توجیهی
        </span>
    </button>


    <!-- 02 -->
    <button
        class="menu-item"
        data-page="02.html"
    >
        <span class="menu-icon">
            ⚙️
        </span>

        <span class="menu-label">
            دامنه، قابلیت‌ها و نظام عملکردی سامانه
        </span>
    </button>


    <!-- 03 -->
    <button
        class="menu-item"
        data-page="03.html"
    >
        <span class="menu-icon">
            🏗️
        </span>

        <span class="menu-label">
            معماری و چارت عملکردی سامانه
        </span>
    </button>


    <!-- 04 -->
    <button
        class="menu-item"
        data-page="04.html"
    >
        <span class="menu-icon">
            🖥️
        </span>

        <span class="menu-label">
            زیرساخت‌ها و الزامات فنی و عملیاتی
        </span>
    </button>


    <!-- 05 -->
    <button
        class="menu-item"
        data-page="05.html"
    >
        <span class="menu-icon">
            👥
        </span>

        <span class="menu-label">

    <!-- 06 -->

    >

        </span>

        <span class="menu-label">

    <!-- 07 -->

    <!-- 08 -->
    <button

</nav>



        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="sidebar-footer">
            © 2026 Future Management
        </div>

    </aside>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="content">

        <div class="iframe-shell">

            <div
                class="loading"
                id="loading"
            >

                <div class="loader-box">

                    <div class="loader"></div>

                    <div class="loading-text">
                        در حال بارگذاری صفحه...
                    </div>

                </div>

            </div>


            <iframe
                id="pageFrame"
                src="pages/dashboard.html"
                title="Dashboard"
                allowfullscreen
            ></iframe>

        </div>

    </main>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const menuItems =
    document.querySelectorAll(".menu-item");

const frame =
    document.getElementById("pageFrame");

const loading =
    document.getElementById("loading");


/* =========================================================
   LOAD PAGE
========================================================= */

function loadPage(url, item) {

    if (!url) return;


    /* Active menu */

    menuItems.forEach(menu => {
        menu.classList.remove("active");
    });

    item.classList.add("active");


    /* Show loading */

    loading.classList.remove("hidden");


    /* Load iframe */

    frame.src = url;


    /* Save current page */

    localStorage.setItem(
        "dashboardCurrentPage",
        url
    );

}


/* =========================================================
   MENU CLICK
========================================================= */

menuItems.forEach(item => {

    item.addEventListener(
        "click",
        () => {

            const page =
                item.dataset.page;

            loadPage(
                page,
                item
            );

        }
    );

});


/* =========================================================
   IFRAME LOADED
========================================================= */

frame.addEventListener(
    "load",
    () => {

        setTimeout(
            () => {

                loading.classList.add(
                    "hidden"
                );

            },
            150
        );

    }
);


/* =========================================================
   RESTORE LAST PAGE
========================================================= */

const savedPage =
    localStorage.getItem(
        "dashboardCurrentPage"
    );


if (savedPage) {

    const matchingItem =
        [...menuItems].find(
            item =>
                item.dataset.page === savedPage
        );


    if (matchingItem) {

        loadPage(
            savedPage,
            matchingItem
        );

    }

}

</script>
