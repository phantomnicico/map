<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>Daraloo GIS Test</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

html,body,#map{
    width:100%;
    height:100%;
    margin:0;
}

</style>

</head>


<body>


<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>


var map = L.map('map')
.setView(
    [32.4279,53.6880],
    6
);



/*
 Base Map تستی
*/

L.tileLayer(

'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

{

maxZoom:19,

attribution:
'© OpenStreetMap'

}

).addTo(map);



/*
 Polygon تست
*/

var area = [

[29.10,57.00],

[29.15,57.10],

[29.05,57.18],

[28.98,57.10]

];


L.polygon(

area,

{

color:'red',

fillColor:'orange',

fillOpacity:0.4

}

)

.addTo(map)

.bindPopup(
"محدوده آزمایشی درآلو"
);



</script>


</body>
</html>
