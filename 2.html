<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daraloo Smart GIS Atlas V2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:tahoma;background:#eee}
.app{display:flex;height:100vh}.side{width:360px;background:#10243e;color:white;padding:16px;overflow:auto}.main{flex:1;position:relative}#map{height:100%}
.card{background:white;color:#222;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 3px 12px #0003}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#eef3f8;padding:10px;text-align:center;border-radius:8px}.stat b{display:block;font-size:22px}
.layer{padding:8px;border-bottom:1px solid #ddd}
.top{position:absolute;z-index:999;top:15px;left:15px;right:15px;display:flex;gap:10px}.kpi{background:white;padding:12px;border-radius:12px;box-shadow:0 3px 10px #0003}
.legend{position:absolute;z-index:999;bottom:20px;left:20px;background:white;padding:12px;border-radius:10px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%}
@media(max-width:900px){.app{display:block}.side{width:100%;height:45%}.main{height:55%}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<h2>اطلس هوشمند درآلو</h2>
<div class="card"><b>جستجو</b><input id="search" style="width:100%;padding:8px;margin-top:8px" placeholder="معدن، روستا..."></div>
<div class="card"><b>شاخص‌ها</b><div class="stats">
<div class="stat"><b>24</b>روستا</div><div class="stat"><b>3200</b>خانوار</div><div class="stat"><b>650</b>هکتار تملک</div><div class="stat"><b>86</b>نقطه</div>
</div></div>
<div class="card"><b>لایه‌ها</b>
<div class="layer"><input class="toggle" data-id="mine" checked type="checkbox"> معدن</div>
<div class="layer"><input class="toggle" data-id="villages" checked type="checkbox"> روستاها</div>
<div class="layer"><input class="toggle" data-id="ownership" checked type="checkbox"> تملکات</div>
<div class="layer"><input class="toggle" data-id="infra" checked type="checkbox"> زیرساخت</div>
<div class="layer"><input class="toggle" data-id="env" checked type="checkbox"> محیط زیست</div>
</div>
<div class="card">وضعیت تملک: 70%<br>ریسک اجتماعی: متوسط<br>پروژه فعال: 18</div>
</aside>
<main class="main">
<div id="map"></div>
<div class="top"><div class="kpi">مساحت<br><b>1250 ha</b></div><div class="kpi">پروژه‌ها<br><b>18</b></div><div class="kpi">پایش<br><b>86</b></div></div>
<div class="legend">🔴 معدن<br>🔵 روستا<br>🟢 تملک</div>
</main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([29.05,57.07],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

let layers={};

layers.mine=L.polygon([[29.10,57],[29.14,57.08],[29.10,57.15],[29.02,57.17],[28.97,57.10],[28.99,57.02]],{color:'red',fillColor:'orange',fillOpacity:.35}).addTo(map).bindPopup('<b>محدوده معدن مس درآلو</b><br>1250 هکتار');

layers.villages=L.layerGroup();
[['روستای الف',29.12,57.06],['روستای ب',29.04,57.12]].forEach(x=>L.circleMarker([x[1],x[2]],{radius:8,color:'blue'}).bindPopup(x[0]).addTo(layers.villages));
layers.villages.addTo(map);

layers.ownership=L.polygon([[29.06,57.03],[29.08,57.08],[29.04,57.1]],{color:'green',fillOpacity:.3}).addTo(map);
layers.infra=L.layerGroup();layers.env=L.layerGroup();

document.querySelectorAll('.toggle').forEach(t=>t.onchange=()=>t.checked?map.addLayer(layers[t.dataset.id]):map.removeLayer(layers[t.dataset.id]));

document.getElementById('search').onkeyup=e=>{if(e.target.value.includes('معدن')){map.fitBounds(layers.mine.getBounds());layers.mine.openPopup()}};

map.fitBounds(layers.mine.getBounds());
</script>
</body>
</html>
