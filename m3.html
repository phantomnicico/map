<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daraloo GIS - Polygon Test</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Tahoma, Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* عنوان بالای نقشه */
        .map-title {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;

            background: rgba(255, 255, 255, 0.95);
            padding: 12px 18px;
            border-radius: 8px;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);

            font-size: 16px;
            font-weight: bold;
        }

        /* راهنمای نقشه */
        .legend {
            position: absolute;
            bottom: 25px;
            right: 20px;
            z-index: 1000;

            background: rgba(255, 255, 255, 0.95);
            padding: 12px 16px;
            border-radius: 8px;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);

            font-size: 13px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 25px;
            height: 14px;

            background: rgba(255, 140, 0, 0.35);
            border: 3px solid #d62828;

            border-radius: 3px;
        }

        /* Popup */
        .popup-content {
            min-width: 220px;
            line-height: 1.8;
        }

        .popup-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <!-- عنوان -->
    <div class="map-title">
        سامانه اطلاعات مکانی منطقه درآلو
    </div>

    <!-- نقشه -->
    <div id="map"></div>

    <!-- Legend -->
    <div class="legend">
        <div class="legend-item">
            <div class="legend-color"></div>
            <span>محدوده فرضی</span>
        </div>
    </div>


    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        /*
        ============================================================
        1. ایجاد نقشه
        ============================================================
        */

        const map = L.map('map', {
            zoomControl: true
        });


        /*
        ============================================================
        2. OpenStreetMap
        ============================================================
        */

        const osm = L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,

                attribution:
                    '&copy; OpenStreetMap contributors'
            }
        );

        osm.addTo(map);


        /*
        ============================================================
        3. داده فرضی Polygon
           
        فعلاً مختصات به صورت Hard-coded هستند.

        در نسخه بعدی همین قسمت می‌تواند از:
        
            PostGIS
            REST API
            GeoJSON API

        دریافت شود.
        ============================================================
        */

        const areaData = {
            id: 1,

            name: "محدوده فرضی درآلو",

            type: "محدوده مطالعاتی",

            area: "تقریباً 25 کیلومتر مربع",

            status: "نمونه / آزمایشی",

            description:
                "این محدوده صرفاً برای تست اولیه سامانه GIS ایجاد شده است.",

            coordinates: [
                [29.10, 57.00],
                [29.14, 57.08],
                [29.10, 57.15],
                [29.02, 57.17],
                [28.97, 57.10],
                [28.99, 57.02]
            ]
        };


        /*
        ============================================================
        4. ایجاد Polygon
        ============================================================
        */

        const polygon = L.polygon(
            areaData.coordinates,
            {
                color: '#d62828',

                weight: 3,

                opacity: 1,

                fillColor: '#f77f00',

                fillOpacity: 0.35
            }
        ).addTo(map);


        /*
        ============================================================
        5. اطلاعات Polygon
        ============================================================
        */

        polygon.bindPopup(`
            <div class="popup-content">

                <div class="popup-title">
                    ${areaData.name}
                </div>

                <div>
                    <strong>شناسه:</strong>
                    ${areaData.id}
                </div>

                <div>
                    <strong>نوع:</strong>
                    ${areaData.type}
                </div>

                <div>
                    <strong>مساحت:</strong>
                    ${areaData.area}
                </div>

                <div>
                    <strong>وضعیت:</strong>
                    ${areaData.status}
                </div>

                <hr>

                <div>
                    ${areaData.description}
                </div>

            </div>
        `);


        /*
        ============================================================
        6. واکنش به کلیک
        ============================================================
        */

        polygon.on('click', function () {

            console.log(
                "Selected Polygon:",
                areaData
            );

        });


        /*
        ============================================================
        7. Zoom روی محدوده
        ============================================================
        */

        map.fitBounds(
            polygon.getBounds(),
            {
                padding: [50, 50]
            }
        );


        /*
        ============================================================
        8. قابلیت Hover
        ============================================================
        */

        polygon.on('mouseover', function () {

            polygon.setStyle({
                color: '#9d0208',
                weight: 5,
                fillOpacity: 0.5
            });

        });


        polygon.on('mouseout', function () {

            polygon.setStyle({
                color: '#d62828',
                weight: 3,
                fillOpacity: 0.35
            });

        });


    </script>

</body>
</html>
