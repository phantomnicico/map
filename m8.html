<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MeMaps Test</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script>

    // ==============================
    // ساخت نقشه
    // ==============================

    var map = L.map('map').setView(
      [32.4279, 53.6880],
      6
    );


    // ==============================
    // MeMaps
    // ==============================

    L.tileLayer(
      'https://memaps.ir/hot/{z}/{x}/{y}.png?key=mm_2c3e22c6a9d65a2b74e3c9e4c42dd77ed9d25d085d8b04ba',
      {
        attribution: '© می‌مپس',
        maxZoom: 18
      }
    ).addTo(map);

  </script>

</body>
</html>
